<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOO-THOLEN // VORTEX OS VIEWPORT MATRIX (tree.html)</title>
    <style>
        :root {
            --bg-body: #070a0f;
            --container-bg: #0d131c;
            --border-color: #24344d;
            --panel-bg: #131c29;
            --card-border: #334155;
            --text-main: #e2e8f0;
            --text-dim: #94a3b8;
            --accent-cyan: #00e5ff;
            --accent-amber: #ffb300;
            --accent-orange: #ea580c;
            --accent-green: #00e676;
            --font-mono: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: var(--font-mono);
            font-size: 13px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 100vh;
        }

        .top-control-bar {
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }

        .theme-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .theme-btn {
            background: var(--panel-bg);
            border: 1px solid var(--card-border);
            padding: 6px 12px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-main);
        }
        .theme-btn:hover {
            border-color: var(--accent-cyan);
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot-yellow { background: #f59e0b; }
        .dot-amber { background: #d97706; }
        .dot-sun { background: #eab308; }
        .dot-red { background: #dc2626; }

        .viewport-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            flex: 1;
        }

        @media (max-width: 1024px) {
            .viewport-grid {
                grid-template-columns: 1fr;
            }
        }

        .viewport-box {
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: all 0.3s ease;
        }

        .viewport-box.expanded {
            position: fixed;
            top: 16px;
            left: 16px;
            right: 16px;
            bottom: 16px;
            z-index: 1000;
            max-width: none !important;
            height: calc(100vh - 32px);
        }

        .viewport-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 8px;
        }

        .viewport-title {
            font-weight: 700;
            font-size: 13px;
            color: var(--accent-cyan);
            letter-spacing: -0.2px;
        }

        .viewport-controls {
            display: flex;
            gap: 6px;
        }

        .ctrl-btn {
            background: var(--panel-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 11px;
            cursor: pointer;
            font-family: var(--font-mono);
        }
        .ctrl-btn:hover {
            border-color: var(--accent-amber);
            color: var(--accent-amber);
        }

        .link-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 480px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .link-item {
            background: var(--panel-bg);
            border: 1px solid var(--card-border);
            border-radius: 4px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: var(--text-main);
            font-size: 12px;
            transition: all 0.2s;
        }
        .link-item:hover {
            border-color: var(--accent-cyan);
            transform: translateX(2px);
        }
        .link-desc {
            color: var(--text-dim);
            font-size: 10px;
            display: block;
            margin-top: 2px;
        }

        .pdf-controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .file-display {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--card-border);
            padding: 6px 10px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-dim);
            min-width: 140px;
        }

        .action-btn {
            background: var(--panel-bg);
            border: 1px solid var(--card-border);
            padding: 6px 12px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-main);
            white-space: nowrap;
        }
        .action-btn:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .load-zaak-btn {
            background: var(--accent-orange);
            color: #ffffff;
            border: 1px solid #c2410c;
            padding: 6px 12px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .load-zaak-btn:hover {
            background: #c2410c;
        }

        .pdf-viewer-canvas {
            background: #000000;
            border: 1px solid var(--card-border);
            border-radius: 4px;
            flex: 1;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            font-size: 12px;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="top-control-bar">
        <div class="theme-buttons">
            <button class="theme-btn" onclick="setTheme('helder')"><span class="dot dot-yellow"></span> Helder</button>
            <button class="theme-btn" onclick="setTheme('donker')"><span class="dot dot-amber"></span> Donker</button>
            <button class="theme-btn" onclick="setTheme('daglicht')"><span class="dot dot-sun"></span> Daglicht</button>
            <button class="theme-btn" onclick="setTheme('nachtlicht')"><span class="dot dot-red"></span> Nachtlicht</button>
        </div>
        <div style="font-size: 11px; color: var(--accent-green);">● SYSTEM ONLINE (VERCEL DEPLOYED)</div>
    </div>

    <div class="viewport-grid">
        
        <!-- VP-1: Navigatie & Alle Systeemlinks -->
        <div class="viewport-box" id="vp1">
            <div class="viewport-header">
                <span class="viewport-title">VP-1: VORTEX OS NAVIGATIE & ALLE LINKS</span>
                <div class="viewport-controls">
                    <button class="ctrl-btn" onclick="adjustSize('vp1', -1)">-</button>
                    <button class="ctrl-btn" onclick="adjustSize('vp1', 1)">+</button>
