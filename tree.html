<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOO-THOLEN // VORTEX OS VIEWPORT MATRIX (tree.html)</title>
    <style>
        :root {
            --bg-body: #e4e9f0;
            --container-bg: #eef2f7;
            --border-color: #cbd5e1;
            --panel-bg: #f8fafc;
            --card-border: #94a3b8;
            --text-main: #1e293b;
            --text-dim: #64748b;
            --accent-orange: #ea580c;
            --font-mono: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: var(--font-mono);
            font-size: 13px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 100vh;
        }

        /* Bovenste configuratie / thema balk */
        .top-control-bar {
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Knoppen stijl */
        .theme-btn {
            background: #ffffff;
            border: 1px solid var(--card-border);
            padding: 6px 12px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-main);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .theme-btn:hover {
            background: #f1f5f9;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot-yellow { background: #f59e0b; }
        .dot-amber { background: #d97706; }
        .dot-sun { background: #eab308; }
        .dot-red { background: #dc2626; }

        /* Hoofdgrid met twee viewports (VP-1 en VP-2) */
        .viewport-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            flex: 1;
        }

        @media (max-width: 1024px) {
            .viewport-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Viewport container box */
        .viewport-box {
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .viewport-title {
            font-weight: 700;
            font-size: 14px;
            color: var(--text-main);
            letter-spacing: -0.2px;
        }

        /* VP-1 Inhoud */
        .search-row {
            display: flex;
            gap: 8px;
        }

        .dork-input {
            flex: 1;
            background: #ffffff;
            border: 1px solid var(--card-border);
            padding: 8px 12px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-main);
        }

        .action-btn {
            background: #ffffff;
            border: 1px solid var(--card-border);
            padding: 8px 14px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-main);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            white-space: nowrap;
        }
        .action-btn:hover {
            background: #f1f5f9;
        }

        .helper-text {
            color: var(--text-dim);
            font-size: 11px;
            margin-top: 2px;
        }

        /* VP-2 Inhoud */
        .pdf-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .file-display {
            flex: 1;
            background: #ffffff;
            border: 1px solid var(--card-border);
            padding: 8px 12px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-dim);
        }

        .load-zaak-btn {
            background: var(--accent-orange);
            color: #ffffff;
            border: 1px solid #c2410c;
            padding: 8px 14px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            white-space: nowrap;
        }
        .load-zaak-btn:hover {
            background: #c2410c;
        }

        .pdf-viewer-canvas {
            background: #ffffff;
            border: 1px solid var(--card-border);
            border-radius: 4px;
            flex: 1;
            min-height: 420px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.02);
        }
    </style>
</head>
<body>

    <!-- Bovenste knoppenbalk (Thema's) -->
    <div class="top-control-bar">
        <button class="theme-btn"><span class="dot dot-yellow"></span> Helder</button>
        <button class="theme-btn"><span class="dot dot-amber"></span> Donker</button>
        <button class="theme-btn"><span class="dot dot-sun"></span> Daglicht</button>
        <button class="theme-btn"><span class="dot dot-red"></span> Nachtlicht</button>
    </div>

    <!-- Twee Viewport Secties -->
    <div class="viewport-grid">
        
        <!-- VP-1: Google Dork Woo-Search -->
        <div class="viewport-box">
            <div class="viewport-title">VP-1: Google Dork Woo-Search</div>
            <div class="search-row">
                <input type="text" class="dork-input" value="site:tholen.nl filetype:pdf woo">
                <button class="action-btn">Zoek (Google)</button>
            </div>
            <div class="helper-text">Zoek direct naar openbare Woo-verzoeken, besluiten en kadastrale mutaties.</div>
        </div>

        <!-- VP-2: PDF Woo-Reader (PDF.js) -->
        <div class="viewport-box">
            <div class="viewport-title">VP-2: PDF Woo-Reader (PDF.js)</div>
            <div class="pdf-controls">
                <button class="action-btn">Bladeren...</button>
                <div class="file-display">Geen bestand...geselecteerd.</div>
                <button class="load-zaak-btn">Laad Zaak 1504573 (Scherpenisse)</button>
            </div>
            <div class="pdf-viewer-canvas"></div>
        </div>

    </div>

</body>
</html>
