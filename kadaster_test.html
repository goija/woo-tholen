<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>Kadastrale Kaart Canvas (RD-coördinaten Scherpenisse)</title>
    <style>
        body { background: #1a1a1a; color: #fff; font-family: monospace; padding: 20px; margin: 0; }
        canvas { border: 1px solid #444; background: #000; margin-top: 15px; display: block; }
        .controls { margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        input { width: 90px; background: #333; color: #0f0; border: 1px solid #555; padding: 5px; font-family: monospace; }
        button { background: #444; color: #fff; border: 1px solid #777; padding: 6px 12px; cursor: pointer; font-family: monospace; }
        button:hover { background: #555; }
        #status { color: #0f0; font-size: 12px; margin-top: 6px; }
    </style>
</head>
<body>
    <div class="controls">
        <strong>BBOX (RD):</strong>
        <label>X-min: <input type="number" id="minX" value="66000"></label>
        <label>Y-min: <input type="number" id="minY" value="396000"></label>
        <label>X-max: <input type="number" id="maxX" value="67000"></label>
        <label>Y-max: <input type="number" id="maxY" value="397000"></label>
        <button onclick="laadKaart()">Laad Percelen</button>
    </div>
    <div id="status">Bezig met laden...</div>
    <canvas id="mapCanvas" width="900" height="650"></canvas>

    <script>
        laadKaart();

        async function laadKaart() {
            const statusEl = document.getElementById('status');
            const minX = document.getElementById('minX').value;
            const minY = document.getElementById('minY').value;
            const maxX = document.getElementById('maxX').value;
            const maxY = document.getElementById('maxY').value;
            const bbox = `${minX},${minY},${maxX},${maxY}`;

            statusEl.textContent = `Ophalen BBOX ${bbox}...`;

            try {
                let data = null;
                try {
                    const res = await fetch(`/api/percelen?bbox=${bbox}`);
                    const contentType = res.headers.get("content-type") || "";
                    if (res.ok && contentType.includes("application/json")) {
                        data = await res.json();
                    }
                } catch (_) {}

                if (!data || (!data.features && !Array.isArray(data))) {
                    const pdokUrl = `https://service.pdok.nl/kadaster/kadastralekaart/wfs/v5_0?service=WFS&version=2.0.0&request=GetFeature&typeName=kadastralekaart:perceel&outputFormat=application/json&srsName=EPSG:28992&bbox=${bbox},EPSG:28992`;
                    const pdokRes = await fetch(pdokUrl);
                    data = await pdokRes.json();
                }

                drawPolygons(data);
            } catch (err) {
                console.error("Fout bij laden:", err);
                statusEl.textContent = `Fout bij laden: ${err.message}`;
            }
        }

        function berekenOppervlakte(ring) {
            let area = 0;
            for (let i = 0; i < ring.length - 1; i++) {
                area += (ring[i][0] * ring[i + 1][1]) - (ring[i + 1][0] * ring[i][1]);
            }
            return Math.abs(area) / 2;
        }

        function extractPolygons(data) {
            if (!data) return [];
            if (Array.isArray(data)) {
                return data.map(p => ({
                    id: p.id || "Perceel",
                    ring: p.coordinates[0]
                }));
            }
            if (data.features && Array.isArray(data.features)) {
                const lijst = [];
                data.features.forEach(f => {
                    if (!f.geometry || !f.geometry.coordinates) return;
                    const props = f.properties || {};
                    const label = props.perceelnummer
                        ? `${props.sectie || ''} ${props.perceelnummer}`.trim()
                        : (props.id || f.id || "Perceel");

                    if (f.geometry.type === "Polygon") {
                        lijst.push({ id: label, ring: f.geometry.coordinates[0] });
                    } else if (f.geometry.type === "MultiPolygon") {
                        f.geometry.coordinates.forEach(poly => {
                            lijst.push({ id: label, ring: poly[0] });
                        });
                    }
                });
                return lijst;
            }
            return [];
        }

        function drawPolygons(rawData) {
            const canvas = document.getElementById('mapCanvas');
            const ctx = canvas.getContext('2d');
            const statusEl = document.getElementById('status');

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const polygons = extractPolygons(rawData);

            if (polygons.length === 0) {
                statusEl.textContent = "Geen percelen gevonden in deze BBOX.";
                return;
            }

            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            polygons.forEach(p => {
                p.ring.forEach(coord => {
                    if (coord[0] < minX) minX = coord[0];
                    if (coord[0] > maxX) maxX = coord[0];
                    if (coord[1] < minY) minY = coord[1];
                    if (coord[1] > maxY) maxY = coord[1];
                });
            });

            const scaleX = canvas.width / (maxX - minX || 1);
            const scaleY = canvas.height / (maxY - minY || 1);
            const scale = Math.min(scaleX, scaleY) * 0.92;
            const offsetX = (canvas.width - (maxX - minX) * scale) / 2;
            const offsetY = (canvas.height - (maxY - minY) * scale) / 2;

            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 1.5;
            ctx.font = '10px monospace';
            ctx.textAlign = 'center';

            polygons.forEach(p => {
                const coords = p.ring;
                if (!coords || coords.length < 3) return;

                ctx.beginPath();
                let sumX = 0, sumY = 0;
                const n = coords.length - 1;

                for (let i = 0; i < coords.length; i++) {
                    const cx = (coords[i][0] - minX) * scale + offsetX;
                    const cy = canvas.height - ((coords[i][1] - minY) * scale + offsetY);
                    if (i < n) {
                        sumX += cx;
                        sumY += cy;
                    }
                    if (i === 0) ctx.moveTo(cx, cy);
                    else ctx.lineTo(cx, cy);
                }
                ctx.closePath();
                ctx.stroke();

                const opp = berekenOppervlakte(coords);
                const textX = sumX / (n || 1);
                const textY = sumY / (n || 1);

                ctx.fillStyle = '#ffffff';
                ctx.fillText(String(p.id), textX, textY - 4);
                ctx.fillStyle = '#aaaaaa';
                ctx.fillText(`${Math.round(opp)} m²`, textX, textY + 8);
            });

            statusEl.textContent = `${polygons.length} percelen geladen en berekend (RD EPSG:28992).`;
        }
    </script>
</body>
</html>
