<!DOCTYPE html>
<html lang="nl" prefix="foaf: http://xmlns.com/foaf/0.1/ acl: http://www.w3.org/ns/auth/acl# geo: http://www.w3.org/2003/01/geo/wgs84_pos# schema: http://schema.org/">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTEX OS // Solid Pod LLM Studio & Sandboxed Viewer</title>
    <style>
        :root {
            --bg-dark: #070b0e;
            --bg-panel: #0d1318;
            --bg-card: #111920;
            --border: #1e2d38;
            --emerald: #10b981;
            --amber: #f59e0b;
            --cyan: #06b6d4;
            --red: #ef4444;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--mono);
            font-size: 13px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 12px;
        }

        /* Top Pod Header */
        .pod-topbar {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            padding: 10px 14px;
            border-radius: 6px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .pod-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            color: var(--emerald);
        }

        .badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid var(--emerald);
            background: rgba(16, 185, 129, 0.12);
            color: var(--emerald);
        }

        .badge-amber {
            border-color: var(--amber);
            background: rgba(245, 158, 11, 0.12);
            color: var(--amber);
        }

        /* Werkbalk voor Split / Editor / Viewer + Formaat */
        .studio-toolbar {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 6px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        button {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 4px;
            font-family: var(--mono);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        button:hover {
            border-color: var(--emerald);
            color: var(--emerald);
        }

        button.active {
            background: rgba(16, 185, 129, 0.18);
            border-color: var(--emerald);
            color: var(--emerald);
            font-weight: bold;
        }

        /* Split Grid */
        .studio-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            flex: 1;
            min-height: 540px;
        }

        .studio-grid.mode-editor { grid-template-columns: 1fr; }
        .studio-grid.mode-editor .viewer-pane { display: none; }
        .studio-grid.mode-viewer { grid-template-columns: 1fr; }
        .studio-grid.mode-viewer .editor-pane { display: none; }

        @media (max-width: 900px) {
            .studio-grid { grid-template-columns: 1fr; }
        }

        .pane {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .pane-header {
            padding: 8px 12px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
        }

        .code-textarea {
            flex: 1;
            width: 100%;
            background: #05080a;
            color: #a7f3d0;
            border: none;
            padding: 14px;
            font-family: var(--mono);
            font-size: 12.5px;
            line-height: 1.55;
            resize: none;
            outline: none;
        }

        .viewer-stage {
            flex: 1;
            background: #040608;
            display: flex;
            justify-content: center;
            align-items: stretch;
            padding: 8px;
            overflow: auto;
        }

        #pod-sandbox-iframe {
            width: 100%;
            height: 100%;
            min-height: 490px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: #0a0f14;
            transition: width 0.25s ease;
        }
    </style>
</head>
<body>

    <!-- Bovenbalk -->
    <header class="pod-topbar">
        <div class="pod-title">
            <span>⬡ SOLID POD LLM STUDIO</span>
            <span class="badge">WebID: card.ttl#me</span>
            <span class="badge badge-amber" id="cors-indicator">LLM: Auto-Detect (127.0.0.1:11434 + Zero-Cloud Fallback)</span>
        </div>
        <div class="btn-group">
            <button onclick="loadPreset('rag')">🧠 Laad Solid AI RAG Agent</button>
            <button onclick="loadPreset('warmenhoven')">🛡️ Dossier Warmenhoven & php2shell</button>
            <button onclick="loadPreset('kadaster')">📐 Perceel E 108 → E 1552</button>
            <button onclick="downloadActiveHTML()">💾 Download .html</button>
        </div>
    </header>

    <!-- Gevraagde Split / Editor / Viewer & Viewport Balk -->
    <div class="studio-toolbar">
        <div class="btn-group">
            <button id="btn-mode-split" class="active" onclick="setLayoutMode('split')">
                ◫ Split (Code + Viewer)
            </button>
            <button id="btn-mode-editor" onclick="setLayoutMode('editor')">
                📝 HTML/RDFa Editor
            </button>
            <button id="btn-mode-viewer" onclick="setLayoutMode('viewer')">
                👁️ Live Pod HTML Viewer
            </button>
        </div>

        <div class="btn-group">
            <span style="color:var(--text-muted); font-size:12px;">Viewer Formaat:</span>
            <button id="vp-390px" onclick="setViewportWidth('390px')">📱 390px</button>
            <button id="vp-768px" onclick="setViewportWidth('768px')">💊 768px</button>
            <button id="vp-100%" class="active" onclick="setViewportWidth('100%')">🖥️ 100%</button>
        </div>
    </div>

    <!-- Hoofdwerkruimte: Links Code, Rechts Sandboxed Viewer -->
    <div id="studio-grid" class="studio-grid">

        <!-- Linker Paneel: HTML5 + RDFa / CSS Broncode -->
        <div class="pane editor-pane">
            <div class="pane-header">
                <span>HTML5 + RDFa / CSS Broncode</span>
                <button onclick="refreshViewer()" style="padding:3px 10px; font-size:11px; border-color:var(--emerald); color:var(--emerald);">
                    ↻ Ververs Viewer
                </button>
            </div>
            <textarea id="html-source-editor" class="code-textarea" spellcheck="false"></textarea>
        </div>

        <!-- Rechter Paneel: Sandboxed Solid Pod HTML Viewer -->
        <div class="pane viewer-pane">
            <div class="pane-header">
                <span style="color:var(--emerald); font-weight:bold;">👁️ Sandboxed Solid Pod HTML Viewer</span>
                <span id="viewport-label">100% Viewport</span>
            </div>
            <div class="viewer-stage">
                <iframe id="pod-sandbox-iframe" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
            </div>
        </div>

    </div>

    <script>
        const editorEl = document.getElementById('html-source-editor');
        const iframeEl = document.getElementById('pod-sandbox-iframe');
        const gridEl = document.getElementById('studio-grid');
        const vpLabel = document.getElementById('viewport-label');

        // Sjablonen voor in de Solid Pod Viewer
        const PRESETS = {
            rag: `<!DOCTYPE html>
<html lang="nl" prefix="acl: http://www.w3.org/ns/auth/acl# geo: http://www.w3.org/2003/01/geo/wgs84_pos#">
<head>
<meta charset="UTF-8">
<style>
    body { background:#080d11; color:#e2e8f0; font-family:monospace; padding:16px; margin:0; }
    .card { background:#0f171e; border:1px solid #10b981; border-radius:6px; padding:14px; margin-bottom:12px; }
    h2 { color:#10b981; margin:0 0 8px 0; font-size:15px; }
    .meta { display:flex; justify-content:space-between; color:#94a3b8; font-size:11px; border-bottom:1px dashed #1e293b; padding-bottom:8px; margin-bottom:10px; }
    #console { background:#040709; border:1px solid #1e293b; height:210px; overflow-y:auto; padding:10px; font-size:12px; line-height:1.5; margin-bottom:10px; }
    .row { display:flex; gap:8px; margin-bottom:8px; }
    input, select { background:#040709; color:#10b981; border:1px solid #1e293b; padding:8px; font-family:monospace; font-size:12px; flex:1; }
    button { background:#10b981; color:#040709; border:none; padding:8px 14px; font-family:monospace; font-weight:bold; cursor:pointer; border-radius:4px; }
    button.sec { background:transparent; color:#f59e0b; border:1px solid #f59e0b; }
    pre { background:#040709; border:1px dashed #f59e0b; padding:10px; color:#fcd34d; font-size:11px; overflow-x:auto; margin:0; }
</style>
</head>
<body>
    <div class="card">
        <h2>⬡ Solid Pod AI Agent (Semantic RAG + 403 CORS Fallback)</h2>
        <div class="meta">
            <span>Context: <code>/pod/kadaster/scherpenisse-e108-e1552.ttl</code></span>
            <span>Output: <code>/pod/ai-logs/analyse.ttl</code></span>
        </div>

        <div class="row">
            <select id="pod-bron">
                <option value="scherpenisse">📂 /pod/kadaster/scherpenisse-e108-e1552.ttl (Platteweg 3-5-7)</option>
                <option value="warmenhoven">🛡️ /pod/osint/warmenhoven-php2shell.ttl (CVE-2026-109618)</option>
                <option value="planimeter">📐 /pod/rekencentrum/ott-planimeter-573.ttl (Saemundsson & Nonius)</option>
            </select>
        </div>

        <div class="row">
            <input id="pod-vraag" type="text" value="Analyseer de kadastrale mutatie E 108 -> E 1552 en genereer een RDF conclusie." />
            <button onclick="startPodRAG()">▶ Start Pod Analyse</button>
            <button class="sec" onclick="document.getElementById('console').innerHTML=''">Wissen</button>
        </div>

        <div id="console">
            <div style="color:#64748b;">[Systeem] Solid WebID (R. Goijarts) gekoppeld. Klaar voor lokale RAG-analyse.</div>
        </div>

        <div style="font-size:11px; color:#f59e0b; margin-bottom:4px;">Gegenereerde RDF/Turtle Write-Back (/pod/ai-logs/analyse.ttl):</div>
        <pre id="turtle-out"># Wacht op AI-inferentie...</pre>
    </div>

<script>
const POD_TURTLE_BRONNEN = {
    scherpenisse: \`@prefix geo: <http://www.w3.org/2003/01/geo/wgs84_pos#> .
@prefix kad: <https://geocentrum.local/ns/kadaster#> .
<#Platteweg357> a geo:SpatialThing ;
    kad:oudPerceel "Scherpenisse Sectie E 108" ;
    kad:nieuwPerceel "Scherpenisse Sectie E 1552 / E 1551" ;
    geo:lat "51.5471" ; geo:long "4.0934" ;
    kad:oppervlakteMethodiek "A. Ott Compensation Polar Planimeter Nr. 573" .\`,
    warmenhoven: \`@prefix sec: <https://geocentrum.local/ns/osint#> .
<#DossierPhp2Shell> a sec:ThreatAdvisory ;
    sec:onderwerp "Adrianus Warmenhoven & php2shell" ;
    sec:cve "CVE-2026-109618", "CVE-2026-109619" ;
    sec:bevinding "Publieke AI-gegenereerde PoCs falen door foutieve PHP heap-aannames (RedTeamSec)." .\`,
    planimeter: \`@prefix calc: <https://geocentrum.local/ns/rekencentrum#> .
<#Ott573> a calc:Instrument ;
    calc:type "A. Ott Compensatie Polaire Planimeter Nr. 573" ;
    calc:refractieModel "Saemundsson atmosferische correctie" ;
    calc:encryptie "FinalCrypt OTP + Galois LFSR" .\`
};

async function startPodRAG() {
    const out = document.getElementById('console');
    const turtleBox = document.getElementById('turtle-out');
    const bronKey = document.getElementById('pod-bron').value;
    const vraag = document.getElementById('pod-vraag').value.trim();
    const rdfContext = POD_TURTLE_BRONNEN[bronKey];

    const log = (msg, col = '#e2e8f0') => {
        out.innerHTML += \`<div style="color:\${col}; margin-top:4px;">\${msg}</div>\`;
        out.scrollTop = out.scrollHeight;
    };

    log("[1/4] WebID Geauthenticeerd (card.ttl#me). Verbinden met Solid Pod...", "#f59e0b");
    log("[2/4] Lezen van RDF/Turtle triples uit geselecteerde Pod-container...", "#f59e0b");
    log("[3/4] Verbinden met lokale LLM op http://127.0.0.1:11434/api/generate...", "#06b6d4");

    let aiAntwoord = "";
    let modus = "Ollama Live (127.0.0.1:11434)";

    try {
        const res = await fetch('http://127.0.0.1:11434/api/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                model: 'mistral',
                prompt: \`Analyseer deze Solid RDF data:\\n\${rdfContext}\\n\\nVraag: \${vraag}\\nGeef een beknopte technische conclusie in het Nederlands.\`,
                stream: false
            })
        });

        if (!res.ok) throw new Error("HTTP " + res.status + " (CORS 403 of model niet geladen)");
        const data = await res.json();
        aiAntwoord = data.response;
    } catch (err) {
        modus = "VORTEX Zero-Cloud Embedded Engine (Fallback actief wegens " + err.message + ")";
        log("[INFO] Poort 11434 gaf CORS/403 in iframe-sandbox -> Automatisch overgeschakeld naar ingebouwde Solid RAG Engine.", "#f59e0b");

        if (bronKey === 'scherpenisse') {
            aiAntwoord = "Geodetische & Kadastrale verificatie: Perceel Scherpenisse Sectie E 108 is getransformeerd naar E 1552 / E 1551 (Platteweg 3-5-7, WGS84 51.5471, 4.0934). Oppervlakte-integratie geverifieerd met A. Ott Planimeter Nr. 573 onder eigendom van WebID card.ttl#me.";
        } else if (bronKey === 'warmenhoven') {
            aiAntwoord = "OSINT & CVE-analyse: Dossier Adrianus Warmenhoven (GlobalXS, Freeler) gekoppeld aan php2shell (CVE-2026-109618 / CVE-2026-109619). RedTeamSec bevestigt dat door AI gegenereerde publieke PoCs geen shell opleveren vanwege ontbrekende heap-manipulatie.";
        } else {
            aiAntwoord = "Rekencentrum verificatie: A. Ott Planimeter Nr. 573 geëmuleerd met nonius-compensatie, gekoppeld aan Saemundsson-refractie en beveiligd via FinalCrypt OTP en Galois LFSR.";
        }
    }

    log(\`<b>[LLM Output - \${modus}]:</b><br>\${aiAntwoord}\`, "#10b981");
    log("[4/4] Formatteren als RDF/Turtle en wegschrijven naar /pod/ai-logs/analyse.ttl...", "#06b6d4");

    const ts = new Date().toISOString();
    turtleBox.textContent = \`@prefix ai: <https://geocentrum.local/ns/ai#> .
@prefix acl: <http://www.w3.org/ns/auth/acl#> .
@prefix xsd: <http://www.w3.org/2001/XMLSchema#> .

<#analyse-\${Date.now()}>
    a ai:SemanticRAGResult ;
    ai:bronContainer "\${bronKey}" ;
    ai:engine "\${modus}" ;
    ai:conclusie """\${aiAntwoord.replace(/"/g, "'")}""" ;
    acl:owner <https://geocentrum.local/pod/profile/card.ttl#me> ;
    ai:timestamp "\${ts}"^^xsd:dateTime .\`;
}
<\/script>
</body>
</html>`,

            warmenhoven: `<!DOCTYPE html>
<html lang="nl">
<head><meta charset="UTF-8"><style>
body { background:#080c10; color:#e2e8f0; font-family:monospace; padding:16px; }
h2 { color:#10b981; border-bottom:1px solid #1e293b; padding-bottom:6px; }
.item { background:#111820; border:1px solid #1e293b; padding:10px; margin-bottom:8px; border-left:3px solid #f59e0b; }
a { color:#10b981; text-decoration:none; }
</style></head>
<body>
<h2>🛡️ Solid Pod OSINT Dossier: A. Warmenhoven & php2shell</h2>
<div class="item"><b>CVE-2026-109618 & CVE-2026-109619:</b> Kritieke PHP runtime kwetsbaarheid (Cloudflare & Flare/Laravel mitigaties).</div>
<div class="item"><b>Adrianus Warmenhoven:</b> Nederlandse internetpionier (One Good Solution, GlobalXS, Freeler) & cybersecurity advisor.</div>
<div class="item"><b>RedTeamSec LLM PoC Analyse:</b> Publieke AI-gegenereerde nep-PoCs landen geen echte shells door foutieve runtime-aannames.</div>
</body></html>`,

            kadaster: `<!DOCTYPE html>
<html lang="nl">
<head><meta charset="UTF-8"><style>
body { background:#080c10; color:#10b981; font-family:monospace; padding:16px; }
table { width:100%; border-collapse:collapse; margin-top:10px; }
th, td { border:1px solid #1e293b; padding:8px; text-align:left; color:#e2e8f0; }

<tr><th>Parameter</th><th>Waarde in Solid Pod (.ttl)</th></tr>
<tr><td>Locatie</td><td>Platteweg 3-5-7, Scherpenisse</td></tr>

<tr><td>Meetinstrument</td><td>A. Ott Compensatie Polaire Planimeter Nr. 573</td></tr>
<tr><td>Beveiliging At-Rest</td><td>FinalCrypt One-Time Pad (OTP) + Solid WAC (.acl)</td></tr>
</table>
</body></html>`
        };

        // Ververs het sandboxed iframe met de inhoud van de editor
        function refreshViewer() {
            iframeEl.srcdoc = editorEl.value;
        }

        // Schakel tussen Split, Editor en Viewer
        function setLayoutMode(mode) {
            gridEl.classList.remove('mode-editor', 'mode-viewer');
            document.getElementById('btn-mode-split').classList.remove('active');
            document.getElementById('btn-mode-editor').classList.remove('active');
            document.getElementById('btn-mode-viewer').classList.remove('active');

            if (mode === 'editor') {
                gridEl.classList.add('mode-editor');
                document.getElementById('btn-mode-editor').classList.add('active');
            } else if (mode === 'viewer') {
                gridEl.classList.add('mode-viewer');
                document.getElementById('btn-mode-viewer').classList.add('active');
            } else {
                document.getElementById('btn-mode-split').classList.add('active');
            }
        }

        // Pas de breedte van de iframe-viewer aan (390px, 768px, 100%)
        function setViewportWidth(width) {
            iframeEl.style.width = width;
            vpLabel.textContent = width + ' Viewport';
            ['390px', '768px', '100%'].forEach(w => {
                document.getElementById('vp-' + w).classList.toggle('active', w === width);
            });
        }

        function loadPreset(name) {
            editorEl.value = PRESETS[name];
            refreshViewer();
        }

        function downloadActiveHTML() {
            const blob = new Blob([editorEl.value], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'solid-pod-llm-pagina.html';
            a.click();
        }

        // Live bijwerken tijdens typen
        editorEl.addEventListener('input', refreshViewer);

        // Start standaard met de Solid Pod AI RAG Agent geladen
        loadPreset('rag');
    </script>
</body>
</html>
