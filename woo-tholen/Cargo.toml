[package]
name = "woo-tholen"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "percelen"
path = "api/percelen.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
vercel_runtime = "1.1.1"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
