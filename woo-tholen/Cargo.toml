[package]
name = "woo-tholen-api"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }
serde_json = "1.0"
vercel_runtime = "1.1"

[[bin]]
name = "percelen"
path = "api/percelen.rs"
